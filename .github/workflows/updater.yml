name: Package Updater
permissions: write-all

on:
  #push:
  #  branches: [master]
  workflow_dispatch: # Enable manual trigger
    inputs:
      packages:
        description: "What is the packages (optionally version) you wish to force update on?"
        required: false
  schedule:
    - cron: "10 */8 * * *"

env:
  # Set au version to use or omit to use the latest. Specify branch name to use development version from Github
  au_version: develop
  au_push: true
  # Use 1 to test all, or N to split testing into N groups
  au_test_groups: 1

  # Github token to commit pushed packages to repository
  github_user_repo: ${{ github.repository }}
  github_api_key: "${{ secrets.GITHUB_TOKEN }}"

  # Mail credentials - for error notifications
  mail_user: ${{ secrets.MAIL_USER }}
  mail_pass: ${{ secrets.MAIL_PASSWORD }}
  mail_server: smtp.gmail.com
  mail_port: 587
  mail_enablessl: true
  mail_attachments: '.\update_info.xml'
  mail_userMessage: "[Force Test](https://gist.github.com/94c2ec0efd8f0d199af1ae9914bec446)"

  #ID of the gist used to save run results
  gist_id: 94c2ec0efd8f0d199af1ae9914bec446

  #Chocolatey API key - to push updated packages
  api_key: ${{ secrets.CHOCO_API_KEY }}

  # GitHub Actions build url which points to this build
  GH_ACTIONS_BUILD_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

  nupkg_cache_path: C:\nupkg_cache
  nuget_artifacts: ${{ github.runner.temp }}/artifacts
  VT_APIKEY: ${{ secrets.VT_APIKEY }}

jobs:
  updater:
    runs-on: windows-2025
    defaults:
      run:
        shell: powershell

    steps:
      - uses: actions/checkout@master
        with:
          fetch-depth: 100

      - name: Configure git client
        run: |
          git config --global user.email "helpdesk.choc@gmail.com"
          git config --global user.name "Tunisiano"
          git config --global core.safecrlf false

      - name: Install Powershell Modules
        env:
          GH_SECRET: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Install-Module -Name PowerShellForGitHub -Force
          $secureString = ("$env:GH_SECRET" | ConvertTo-SecureString -AsPlainText -Force)
          $cred = New-Object System.Management.Automation.PSCredential "username is ignored", $secureString
          Set-GitHubAuthentication -Credential $cred
          $secureString = $null # clear this out now that it's no longer needed
          $cred = $null # clear this out now that it's no longer needed
          Set-GitHubConfiguration -DisableTelemetry

      - name: Install Dependencies
        run: |
          Set-Service wuauserv -StartupType Manual
          choco install --no-progress wormies-au-helpers vt-cli -y
          # chocolatey-au's own Install-AU.ps1 always runs "./build.ps1 -Task Build" (regardless of
          # $Env:au_version being a tag, a branch, or empty for "latest release") to build the module
          # from source, and that build task shells out to gitversion.exe/dotnet-gitversion.exe. The
          # windows-2025 runner image doesn't ship GitVersion the way older images did, so every run
          # has been failing at that step before even reaching package updates. Install it explicitly
          # rather than depending on the runner image.
          # Neither prepending $env:PATH nor writing $GITHUB_PATH (#95/#96) made a global `dotnet tool
          # install` visible to Install-AU.ps1's build further down. #97 then tried copying the shim
          # from the default global-tool location into C:\ProgramData\chocolatey\bin (on machine PATH
          # since before this job started), but that assumed a fixed shim filename/location that
          # GitVersion.Tool 7.0.1 didn't actually use. #98 then installed straight into that
          # already-on-PATH directory with `dotnet tool install --tool-path`: Get-Command found the
          # resulting dotnet-gitversion.exe right after install and again ~2 minutes later in AU's own
          # InstallGitVersion task, but the Build task's own *direct* invocation of dotnet-gitversion.exe
          # a few seconds after that still failed with "term ... is not recognized" (confirmed live on
          # runs 45130654069 and 45042380368, both on #98's own merge commit) - a raw dotnet-tool shim
          # evidently isn't reliably resolvable later in the same PowerShell session even once found.
          # Use Chocolatey's own ShimGen-based install instead (the exact mechanism AU's InstallGitVersion
          # task itself falls back to, and the same one that reliably produces working shims for choco,
          # vt.exe and wormies-au-helpers earlier in this very job) so GitVersion.Tool isn't resolved via
          # a dotnet-tool shim at all.
          choco install gitversion.portable -y --no-progress
          git clone -q https://github.com/chocolatey-community/chocolatey-au.git $Env:TEMP/au
          . "$Env:TEMP/au/scripts/Install-AU.ps1" $Env:au_version
          import-module "$(Get-Location)\scripts\au_extensions.psm1" -global
          choco apikey --key ${{ secrets.CHOCO_API_KEY }} --source https://push.chocolatey.org/

      - name: System information
        run: |
          Get-CimInstance win32_operatingsystem -Property Caption, OSArchitecture, Version | fl Caption, OSArchitecture, Version
          $PSVersionTable
          git --version
          choco --version
          cmd /c "set" | grep -i 'github\|runner' | sort
          "Build info"
          '  {0,-20} {1}' -f 'SCHEDULED BUILD:', ("${{ github.event_name }}" -eq 'schedule')
          '  {0,-20} {1}' -f 'FORCED BUILD:'   , ("${{ github.event_name }}"    -eq 'workflow_dispatch')

      - name: Run package updater
        env:
          github_api_key: ${{ secrets.AU_GITHUB_API_KEY }}
          FORCED_PACKAGES: ${{ github.event.inputs.packages }}
        run: |
          . ./scripts/EventLogs.ps1
          New-Item -Path 'C:\Users\runneradmin\_netrc' -ItemType Directory
          Clear-EventLogs
          rm "$env:ChocolateyInstall\logs\*.log"
          .\au\requisites.ps1
          Write-Host "updating IconUrl in nuspec"
          scripts/Update-IconUrl.ps1 -Quiet -GithubRepository "tunisiano187/Choco-packages" -UseStopwatch
          au/update_all.ps1 -ForcedPackages $env:FORCED_PACKAGES
          git pull
          git commit -u -m "updated"
          git push origin master
          Get-EventLogs * | ? Source -eq 'Schannel' | fl * | out-file eventlogs.txt

      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
        
      
      - name: Create diff file
        run: |
          git add automatic
          git diff --cached > unsaved_changes.patch

      - name: Create au temporary directory
        run: |
          if (Test-Path $Env:TEMP\chocolatey\au) { 7z a -mx9 au_temp.7z $Env:TEMP\chocolatey\au\* }

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@master
        with:
          name: artifacts
          path: |
            unsaved_changes.patch
            au_temp.7z
            update_info.xml
            au/Update-AUPacakges.md
            eventlogs.txt
            **/*.nupkg
          retention-days: 5


      - name: Update gist with report
        if: always()
        shell: pwsh
        env:
          GIST_ID: ${{ env.gist_id }}
          GIST_TOKEN: ${{ secrets.AU_GITHUB_API_KEY }}
          REPORT_PATH: au/Update-AUPacakges.md
        run: |
          $gistId = $env:GIST_ID
          $token = $env:GIST_TOKEN
          $file = $env:REPORT_PATH
          if (Test-Path $file) {
            $content = Get-Content $file -Raw -Encoding UTF8
            $body = @{ files = @{ 'Update-AUPackages.md' = @{ content = $content } } } | ConvertTo-Json -Depth 10
            try {
              Invoke-RestMethod -Uri "https://api.github.com/gists/$gistId" -Method PATCH -Headers @{ Authorization = "token $token"; Accept = 'application/vnd.github+json' } -Body $body -ContentType 'application/json' -ErrorAction Stop
              Write-Host "Gist updated: $gistId"
            } catch {
              Write-Warning "Failed to update gist $gistId (this is a best-effort report step; it does not affect the actual package update): $_"
            }
          } else {
            Write-Warning "Report file not found: $file"
          }
